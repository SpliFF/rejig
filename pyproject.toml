[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rejig"
version = "0.1.4"
description = "A Python library for programmatic code refactoring and transformation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shannon Baker" },
]
keywords = ["refactoring", "cst", "libcst", "code-transformation", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Core engine: CST manipulation and import sorting, used on every run.
    "libcst>=1.0.0",
    "isort>=5.0.0",
    # Semantic refactoring (move/rename with automatic import updates). Imported
    # by the rope-backed refactors in rejig.core, so it's a hard requirement, not
    # an optional extra.
    "rope>=1.0.0",
    # YAML round-trip editing (rj.yaml()); ruamel.yaml preserves comments, quote
    # styles and key order so writes produce minimal diffs.
    "ruamel.yaml>=0.17.0",
    # TOML round-trip editing (rj.toml(), pyproject manipulation). tomllib is
    # stdlib on 3.11+, so tomli is only needed for the 3.10 read path; tomli-w
    # has no stdlib equivalent and is always required to write TOML.
    "tomli-w>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Optional extras are reserved for heavy, framework-specific packages a user only
# needs when targeting that framework. Rejig rewrites source rather than importing
# frameworks, so there are none today; add one here only when a genuinely heavy,
# framework-only dependency appears.

# Tooling for developing rejig itself. rejig config-manages these (edits their
# tool tables) and emits code that targets them (eg. pytest stubs), but does not
# import or invoke them at runtime, so they stay dev-only.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
rejig = "rejig.cli:main"

[project.urls]
Homepage = "https://github.com/SpliFF/rejig"
Documentation = "https://spliff.github.io/rejig/"
Repository = "https://github.com/SpliFF/rejig"

[tool.hatch.build.targets.wheel]
packages = ["src/rejig"]

[tool.black]
line-length = 110
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 110

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
